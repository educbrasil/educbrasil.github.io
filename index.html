<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NVR Ao Vivo</title>
<style>body{margin:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}video{width:95vw;max-width:1280px;background:#111;border-radius:12px}</style>
</head>
<body>
<video id="v" autoplay muted playsinline controls style="width:95vw;height:72vh"></video>
<script type="module">
const TUNEL = "https://roughly-aruba-emma-reached.trycloudflare.com";
const video = document.getElementById('v');
async function start(){
  const pc = new RTCPeerConnection();
  pc.addTransceiver('video', {direction:'recvonly'});
  pc.ontrack = e => video.srcObject = e.streams[0];
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  const res = await fetch(`${TUNEL}/api/whep?src=desktop`, {
    method:'POST',
    headers:{'Content-Type':'application/sdp'},
    body: offer.sdp
  });
  const answer = await res.text();
  await pc.setRemoteDescription({type:'answer', sdp: answer});
}
start();
</script>
</body>
</html>
